<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stock Investor — Terminal Portfolio Pro{% endblock %}</title>
  <style>
    :root {
      /* Deep Dark Pro Theme */
      --bg: #090d16;
      --card-bg: #111827;
      --card-border: #1f2937;
      --header-bg: #0b1120;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      
      /* Status Colors */
      --green: #10b981;
      --green-bg: rgba(16, 185, 129, 0.12);
      --green-text: #34d399;
      
      --orange: #f59e0b;
      --orange-bg: rgba(245, 158, 11, 0.12);
      --orange-text: #fbbf24;
      
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.12);
      --red-text: #f87171;

      --blue: #3b82f6;
      --blue-bg: rgba(59, 130, 246, 0.12);
      --blue-text: #60a5fa;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    
    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 0.85rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      letter-spacing: 0.05em;
    }

    .brand-badge {
      background: #1e3a8a;
      border: 1px solid #3b82f6;
      color: #93c5fd;
      font-size: 0.65rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    nav { display: flex; gap: 0.5rem; }
    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88rem;
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      transition: all 0.15s ease-in-out;
    }
    nav a:hover, nav a.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .container {
      max-width: 1350px;
      margin: 1.5rem auto;
      padding: 0 1.5rem;
    }

    .header-action {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--text);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--card-border);
      padding: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
    }

    .card-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    
    .table-container {
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--card-border);
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background: #0f172a;
      color: var(--text-muted);
      font-weight: 700;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid rgba(31, 41, 55, 0.6);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }

    a.stock-link {
      color: #60a5fa;
      font-weight: 700;
      text-decoration: none;
    }
    a.stock-link:hover { text-decoration: underline; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge.LOW, .LOW { color: var(--green-text); background: var(--green-bg); }
    .badge.MEDIUM, .MEDIUM { color: var(--orange-text); background: var(--orange-bg); }
    .badge.HIGH, .HIGH { color: var(--red-text); background: var(--red-bg); }
    
    .text-green, .BULL, .BUY { color: var(--green-text); font-weight: 700; }
    .text-red, .BEAR, .SELL { color: var(--red-text); font-weight: 700; }
    .text-neutral, .SIDEWAYS, .NEUTRAL { color: var(--text-muted); font-weight: 600; }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.55rem 1.1rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .sparkline-canvas {
      width: 100px;
      height: 32px;
      display: block;
    }

    /* Toast Notification Container */
    #toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .toast {
      background: #1f2937;
      color: #f3f4f6;
      border-left: 4px solid #3b82f6;
      padding: 0.85rem 1.25rem;
      border-radius: 6px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      font-size: 0.88rem;
      font-weight: 600;
      min-width: 280px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: slideIn 0.25s ease-out;
    }

    .toast.success { border-left-color: #10b981; }
    .toast.error { border-left-color: #ef4444; }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    footer {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.8rem;
      margin-top: 3rem;
      padding-bottom: 2rem;
      border-top: 1px solid rgba(31, 41, 55, 0.4);
      padding-top: 1.5rem;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <a href="/dashboard" class="brand">
      STOCK INVESTOR <span class="brand-badge">PRO TERMINAL</span>
    </a>
    <nav>
      <a href="/dashboard" class="active">Dashboard</a>
      <a href="/portofolio">Portofolio</a>
      <a href="/api/stocks" target="_blank">API</a>
    </nav>
  </header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <div id="toast-container"></div>
  <footer>
    Stock Investor — Professional Low-Risk IDX Analytics Terminal | Dark Mode Powered by FastAPI + Chart.js
  </footer>

  <script>
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }
  </script>
</body>
</html>
